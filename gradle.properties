org.gradle.caching=true
org.gradle.unsafe.configuration-cache=true
org.gradle.unsafe.configuration-cache-problems=warn
#
group=tk.cofedream.plugin
pluginName=Cofe-Mybatis
pluginVersion=2.1.3
platformPlugins=com.intellij.java,com.intellij.spring
# 231
# https://www.jetbrains.com/intellij-repository/releases
# https://www.jetbrains.com/intellij-repository/snapshots
# 262 = IntelliJ IDEA 2026.2.
# 从 262 起 Spring 插件把 MyBatis 扩展类从
#   com.intellij.spring.model.extensions.myBatis.SpringMyBatisBeansProvider
# 移到了
#   com.intellij.spring.core.analysis.jvm.providers.myBatis.SpringMyBatisBeansProvider
# 所以本源码树只能编译到 262+，243~261 的用户停留在 2.1.2-243。
sdkSinceBuild=262
#sdkUntilBuild=262.*
platformType=IU
platformVersion=2026.2
platformDownloadSources=true

jna.nounpack=false